spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: ghostwriter

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 20000
      max-lifetime: 1800000

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 1024
    mcp:
      client:
        enabled: true
        name: ghostwriter
        type: SYNC
        request-timeout: 60s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            imsg:
              url: ${IMSG_MCP_URL:http://localhost:5050}

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_SERVER}

app:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
  cache:
    # Cosine similarity; below this is a miss. Measured on MiniLM-L6: a genuine paraphrase
    # of the same question scores ~0.95+, but two *different* questions that share a template
    # ("when did I talk with Maheen about X") sit ~0.70, and unrelated questions ~0.0. 0.65
    # let template-twins false-hit each other; 0.90 admits real repeats while rejecting them.
    similarity-threshold: 0.90
    ttl: 1h

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
